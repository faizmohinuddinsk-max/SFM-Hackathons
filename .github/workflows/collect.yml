# Runs collect.mjs every day, then saves the new hackathons.json into the repo.
# GitHub Pages republishes the site automatically after that save.
name: Update hackathons

on:
  schedule:
    - cron: "30 20 * * *"   # 20:30 UTC every day = 2:00 AM India time
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab for manual runs

# Lets the job save hackathons.json back into your repo
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Search the web and collect hackathons
        run: node collect.mjs
        env:
          # Read from the secret you created in Settings. The key never appears in the code.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      - name: Save hackathons.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hackathons.json
          git diff --staged --quiet || (git commit -m "Update hackathons" && git push)
