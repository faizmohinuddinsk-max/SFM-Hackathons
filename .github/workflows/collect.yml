
name: Update hackathons

on:
  schedule:
    - cron: "30 20 * * *"   
  workflow_dispatch:       

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ask Gemini for hackathons
        run: node collect.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Save hackathons.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hackathons.json
          git diff --staged --quiet || (git commit -m "Update hackathons" && git push)
